[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolshadow"
version = "0.1.0"
description = "Offline detector for cross-server tool shadowing and rug pulls in MCP tool catalogs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Md Rashedul Hasan"}]

[project.scripts]
toolshadow = "toolshadow.cli:main"

[tool.setuptools]
packages = ["toolshadow"]
